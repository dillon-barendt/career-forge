[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-forge"
version = "0.5.0"
description = "CareerForge — AI agents that forge career data into action."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "google-api-python-client>=2.198.0",
  "google-auth-httplib2>=0.4.0",
  "google-auth-oauthlib>=1.4.0",
  "httpx>=0.27.0",
  "logfire>=4.37.0",
  "pydantic>=2.7.0",
  "pydantic-ai>=2.6.0",
  "pydantic-evals>=1.16.0",
  "pydantic-graph>=2.6.0",
  "pydantic-settings>=2.3.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.0.0",
  "pillow>=11.0.0",
  "pre-commit>=4.0.0",
  "pyright>=1.1.403",
  "pytest>=8.2.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
career-forge = "career_ops.cli:app"

[project.urls]
Homepage = "https://github.com/dillon-barendt/career-forge"
Documentation = "https://github.com/dillon-barendt/career-forge#readme"
Issues = "https://github.com/dillon-barendt/career-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["career_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["career_ops", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["career_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = [
  "career_ops/ai/contracts.py",
  "career_ops/ai/deterministic.py",
  "career_ops/showcase",
  "benchmark",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["career_ops", "benchmark"]
omit = [
  "*/career_ops/gmail/client.py",
  "*/career_ops/providers/notion/gateway.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
