[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-forge"
version = "0.3.0"
description = "Local career automation with Gmail, Pydantic AI, Logfire, Notion, and webhooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "google-api-python-client>=2.198.0",
  "google-auth-httplib2>=0.4.0",
  "google-auth-oauthlib>=1.4.0",
  "httpx>=0.27.0",
  "logfire>=4.37.0",
  "pydantic>=2.7.0",
  "pydantic-ai>=2.6.0",
  "pydantic-evals>=1.16.0",
  "pydantic-settings>=2.3.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.0.0",
  "pre-commit>=4.0.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
career-forge = "career_ops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["career_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["career_ops", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
