name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CAREER_FORGE_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test with coverage
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

  quality:
    needs: test
    runs-on: ubuntu-latest
    env:
      CAREER_FORGE_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python benchmark/bench.py --output benchmark-results.json
      - run: ./demo.sh --json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.json
      - run: docker build -t career-forge-demo .
      - run: docker run --rm -e CAREER_FORGE_MODE=mock career-forge-demo ./demo.sh --json
