name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Smoke demo
        run: ./demo.sh --json
      - name: Run benchmark
        run: uv run python benchmark/bench.py --output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
      - name: Build demo image
        run: docker build -t career-forge-demo .
      - name: Smoke demo image
        run: docker run --rm career-forge-demo ./demo.sh --json
